<svg xmlns="http://www.w3.org/2000/svg" width="880" height="383" viewBox="0 0 880 383" role="img" aria-labelledby="t d">
<title id="t">Giorgi Metskhvarishvili</title>
<desc id="d">Giorgi Metskhvarishvili — Engineering Leader · Software &amp; Solution Architect. .NET, cloud-native &amp; distributed systems. Engineering leader and software architect with 10+ years of experience building large-scale distributed systems in gaming, banking, government and iGaming. I architected a mobile esports platform from scratch to 40+ microservices, 2.6M+ users and 99.98% availability, broke a bank&#x27;s vendor monolith into in-house microservices handling 1–1.5M transactions a day, and led a ~60-person government IT organization through the modernization of 26+ legacy applications. Hands-on in C#/.NET and cloud-native infrastructure, with deep expertise in DDD, CQRS, event-driven architecture, payments, security and fraud prevention. Tbilisi, Georgia. Open to new opportunities · remote or relocation · full-time or B2B.</desc>
