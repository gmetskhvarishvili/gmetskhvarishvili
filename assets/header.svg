<title id="t">Giorgi Metskhvarishvili</title>
<desc id="d">Giorgi Metskhvarishvili — Engineering Leader · Software &amp; Solution Architect. Cloud-native &amp; distributed systems · .NET. Engineering leader with 13+ years of experience designing and delivering large-scale distributed systems across banking, government, gaming and enterprise domains. I architect platforms from the ground up with Clean Architecture, CQRS, Domain-Driven Design and event-driven principles, and have led cross-functional organizations of up to 60 professionals. Tbilisi, Georgia. Open to new opportunities · on-site, hybrid or remote.</desc>
