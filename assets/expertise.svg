<title id="t">Technical expertise</title>
<desc id="d">Technical expertise. Architecture: Distributed Systems, Microservices, Event-Driven Design, Domain-Driven Design, CQRS, Clean Architecture, Event Storming. Languages: C#, Java, Kotlin, Swift, JavaScript. Frameworks: .NET, ASP.NET Core, Entity Framework, FluentValidation, Polly, Wolverine, SignalR, Quartz, Angular, React, Android SDK. Data &amp; Messaging: PostgreSQL, MS SQL, Oracle, Redis, Valkey, Elasticsearch, RabbitMQ, Apache Kafka. Cloud &amp; DevOps: AWS (EKS, RDS, ElastiCache), Microsoft Azure, DigitalOcean, Docker, Kubernetes, Terraform, Argo CD, Bitbucket Pipelines, HashiCorp Vault, Doppler. Observability: Datadog, Dynatrace, Elastic APM, Grafana, Graylog, Cisco AppDynamics.</desc>
