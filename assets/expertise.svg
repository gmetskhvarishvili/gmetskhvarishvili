<title id="t">Technical expertise</title>
<desc id="d">Technical expertise. Architecture: Clean Architecture, CQRS, Domain-Driven Design, Event-Driven Design, Microservices, Distributed Systems, Event Storming. Languages: C#, Java, Kotlin, Swift, JavaScript. Frameworks: .NET, ASP.NET Core, Entity Framework, SignalR, Identity Server 4, MediatR, Quartz, Angular, React, Android SDK. Data &amp; Messaging: PostgreSQL, MS SQL, Oracle, Redis, Valkey, Elasticsearch, RabbitMQ, Apache Kafka. Cloud &amp; DevOps: AWS, Microsoft Azure, Docker, Kubernetes, Argo CD, Rancher, OpenShift, Terraform, HashiCorp Vault, Doppler. Observability: Datadog, Dynatrace, Elastic APM, Grafana, Graylog, Cisco AppDynamics.</desc>
