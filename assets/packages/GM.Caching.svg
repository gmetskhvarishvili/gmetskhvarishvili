<title id="t">GM.Caching</title>
<desc id="d">GM.Caching v1.2.0: A small caching abstraction for .NET: ICacheService with typed Get/Set/Remove, GetOrCreateAsync (single-flight, no cache stampede), and absolute/sliding expiration — plus an in-memory implementation over IMemoryCache. Add a distributed backend with GM.Caching.Redis. 3,813 downloads.</desc>
