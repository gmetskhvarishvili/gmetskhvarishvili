<desc id="d">GM.Documentation v1.3.1: A lightweight, configuration-driven Swagger/OpenAPI setup for ASP.NET Core. One call wires up Swashbuckle with API versioning, FluentValidation rules, OAuth2 security, required-header parameters, custom date formats, and a styled Swagger UI — all from configuration. 1,062 downloads.</desc>
