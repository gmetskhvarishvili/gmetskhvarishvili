<title id="t">GM.DistributedLock</title>
<desc id="d">GM.DistributedLock v1.2.0: A small distributed-lock abstraction for .NET: IDistributedLock with TryAcquire / Acquire (blocking with retry) returning an IAsyncDisposable handle that releases on dispose. Ships a single-process in-memory implementation for dev and tests; add a real backend with GM.DistributedLock.Redis. 2,474 downloads.</desc>
