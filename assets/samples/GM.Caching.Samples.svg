<title id="t">GM.Caching.Samples</title>
<desc id="d">GM.Caching.Samples: runnable sample for GM.Caching. A small caching abstraction for .NET: ICacheService with typed Get/Set/Remove, GetOrCreateAsync (single-flight, no cache stampede), and absolute/sliding expiration — plus an in-memory implementation over IMemoryCache.</desc>
