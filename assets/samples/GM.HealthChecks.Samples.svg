<title id="t">GM.HealthChecks.Samples</title>
<desc id="d">GM.HealthChecks.Samples: runnable sample for GM.HealthChecks. Standardized ASP.NET Core health checks for the GM.* ecosystem: a consistent liveness/readiness/startup tagging convention, JSON responses (status, per-check durations, tags), a generic external-HTTP dependency check, and one call — AddGMHealthChecks() + MapGMHealthChecks() — to wire /health/live, /health/ready and /health/startup.</desc>
